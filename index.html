<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Belt Calculator</title>
  <meta name="description" content="Belt length and center distance for two pulleys, with an animated drawing of the drive.">
  <meta name="theme-color" content="#f3f2ee">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 24" aria-hidden="true">
        <circle cx="9" cy="12" r="6" />
        <circle cx="30" cy="12" r="9" />
        <path d="M8.2 6.05 L28.8 3.08 M8.2 17.95 L28.8 20.92" />
      </svg>
      <div>
        <h1>Belt Calculator</h1>
        <p>two pulleys · open belt</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="ghost-btn" id="share" type="button">Copy link</button>
      <button class="icon-btn" id="theme" type="button" aria-label="Toggle theme">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 3a7 7 0 0 1 0 14z"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel" aria-label="Inputs">
      <div class="seg" id="mode" role="group" aria-label="Calculation type">
        <button type="button" data-mode="timing">Timing belt</button>
        <button type="button" data-mode="diameter">Diameters</button>
      </div>

      <section class="group" data-show="timing">
        <h2>Belt</h2>
        <label class="field">
          <span>Profile</span>
          <select id="profile"></select>
        </label>
        <label class="field">
          <span>Pitch <i>p</i></span>
          <div class="num"><input id="pitch" type="number" min="0.1" step="0.001" inputmode="decimal"><em>mm</em></div>
        </label>
      </section>

      <section class="group" data-show="timing">
        <h2>Pulleys</h2>
        <div class="pair">
          <label class="field">
            <span>Pulley 1 · <i>z</i>₁</span>
            <div class="num stepper">
              <button type="button" data-step="-1" data-for="z1" aria-label="Decrease">−</button>
              <input id="z1" type="number" min="6" step="1" inputmode="numeric">
              <button type="button" data-step="1" data-for="z1" aria-label="Increase">+</button>
            </div>
          </label>
          <label class="field">
            <span>Pulley 2 · <i>z</i>₂</span>
            <div class="num stepper">
              <button type="button" data-step="-1" data-for="z2" aria-label="Decrease">−</button>
              <input id="z2" type="number" min="6" step="1" inputmode="numeric">
              <button type="button" data-step="1" data-for="z2" aria-label="Increase">+</button>
            </div>
          </label>
        </div>
      </section>

      <section class="group" data-show="diameter">
        <h2>Pitch diameters</h2>
        <div class="pair">
          <label class="field">
            <span>Pulley 1 · <i>D</i>₁</span>
            <div class="num"><input id="D1" type="number" min="1" step="0.1" inputmode="decimal"><em>mm</em></div>
          </label>
          <label class="field">
            <span>Pulley 2 · <i>D</i>₂</span>
            <div class="num"><input id="D2" type="number" min="1" step="0.1" inputmode="decimal"><em>mm</em></div>
          </label>
        </div>
      </section>

      <section class="group">
        <h2>Center distance</h2>
        <label class="field">
          <span>Target <i>C</i></span>
          <div class="num"><input id="C" type="number" min="1" step="0.1" inputmode="decimal"><em>mm</em></div>
        </label>
        <input id="C-range" class="range" type="range" min="5" max="800" step="0.5" aria-label="Center distance">
      </section>

      <section class="group" data-show="timing">
        <h2>Selected belt</h2>
        <div class="seg seg-3" id="round" role="group" aria-label="Rounding">
          <button type="button" data-round="down" title="Shorter belt: pulleys move closer, belt ends up tensioned">Shorter</button>
          <button type="button" data-round="near">Nearest</button>
          <button type="button" data-round="up" title="Longer belt: pulleys move apart">Longer</button>
        </div>
        <label class="field">
          <span>Belt teeth</span>
          <div class="num stepper">
            <button type="button" data-step="-1" data-for="teeth" aria-label="Decrease">−</button>
            <input id="teeth" type="number" min="10" step="1" inputmode="numeric">
            <button type="button" data-step="1" data-for="teeth" aria-label="Increase">+</button>
          </div>
        </label>
      </section>
    </aside>

    <section class="main">
      <div class="stage-card">
        <svg id="stage" viewBox="0 0 1000 560" role="img" aria-label="Drawing of the two pulleys and the belt">
          <defs>
            <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M20 0H0V20" class="grid-line"/>
            </pattern>
            <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
              <rect width="100" height="100" fill="url(#grid)"/>
              <path d="M100 0H0V100" class="grid-line major"/>
            </pattern>
            <radialGradient id="metal" cx="35%" cy="30%" r="80%">
              <stop offset="0" class="metal-hi"/>
              <stop offset="1" class="metal-lo"/>
            </radialGradient>
            <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
              <path d="M0 1.5 L10 5 L0 8.5 z" class="arrow-head"/>
            </marker>
          </defs>
          <rect id="stage-bg" width="1000" height="560" fill="url(#grid-major)"/>
          <g id="world"></g>
          <g id="annot"></g>
        </svg>
        <p class="stage-msg" id="stage-msg" hidden></p>
        <div class="stage-bar">
          <button class="ghost-btn" id="play" type="button" aria-pressed="true">
            <svg viewBox="0 0 16 16" aria-hidden="true" class="ic-pause"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>
            <svg viewBox="0 0 16 16" aria-hidden="true" class="ic-play"><path d="M4 2.2v11.6a.6.6 0 0 0 .9.5l9.4-5.8a.6.6 0 0 0 0-1L4.9 1.7a.6.6 0 0 0-.9.5z"/></svg>
            <span>Pause</span>
          </button>
          <span class="hint">Drag the right pulley to change the distance</span>
        </div>
      </div>

      <div class="warnings" id="warnings" aria-live="polite"></div>
      <div class="results" id="results"></div>
    </section>

    <section class="formulas" aria-labelledby="f-title">
      <h2 id="f-title">Step-by-step calculation</h2>
      <div class="formula-list" id="formulas"></div>
    </section>
  </main>

  <footer class="foot">
    All units in mm. Outside diameters (≈) vary slightly by pulley manufacturer.
  </footer>
</body>
</html>
