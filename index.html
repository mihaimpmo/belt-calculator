<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Belt Calculator</title>
  <meta name="description" content="Belt length for two pulleys from the center distance and pitch diameters.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/belt.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <svg class="logo" viewBox="0 0 40 24" aria-hidden="true">
        <circle cx="9" cy="12" r="6" />
        <circle cx="30" cy="12" r="9" />
        <path d="M8.2 6.05 L28.8 3.08 M8.2 17.95 L28.8 20.92" />
      </svg>
      <h1>Belt Calculator</h1>
    </header>

    <section class="inputs" aria-label="Inputs">
      <label class="field">
        <span>Pitch diameter <i>D</i>₁</span>
        <div class="num"><input id="D1" type="number" min="0.1" step="0.1" inputmode="decimal"><em>mm</em></div>
      </label>
      <label class="field">
        <span>Pitch diameter <i>D</i>₂</span>
        <div class="num"><input id="D2" type="number" min="0.1" step="0.1" inputmode="decimal"><em>mm</em></div>
      </label>
      <label class="field">
        <span>Center distance <i>C</i></span>
        <div class="num"><input id="C" type="number" min="0.1" step="0.1" inputmode="decimal"><em>mm</em></div>
      </label>
    </section>

    <section class="stage-card">
      <svg id="stage" viewBox="0 0 1000 480" role="img" aria-label="Drawing of the two pulleys and the belt">
        <defs>
          <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M20 0H0V20" class="grid-line"/>
          </pattern>
          <radialGradient id="metal" cx="35%" cy="30%" r="80%">
            <stop offset="0" class="metal-hi"/>
            <stop offset="1" class="metal-lo"/>
          </radialGradient>
          <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
            <path d="M0 1.5 L10 5 L0 8.5 z" class="arrow-head"/>
          </marker>
        </defs>
        <rect id="stage-bg" width="1000" height="480" fill="url(#grid)"/>
        <g id="world"></g>
        <g id="annot"></g>
      </svg>
      <p class="stage-msg" id="stage-msg" hidden></p>
      <p class="hint">Drag the right pulley to change the distance</p>
    </section>

    <div class="warnings" id="warnings" aria-live="polite"></div>

    <section class="results" id="results" aria-live="polite"></section>

    <section class="formula" id="formula"></section>
  </main>
</body>
</html>
